<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azoki Market</title>
<meta name="description" content="An object from Azoki Market.">
<meta name="theme-color" content="#f3efe6">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/market.css">
</head>
<body class="is-pdp">
<header class="nav" id="nav">
  <a class="logo" href="index.html" aria-label="Azoki Market, home">AZ<span class="o" aria-hidden="true"></span>KI<em>market</em></a>
  <nav class="nav-links" aria-label="Sections">
    <a href="index.html#shop">Shop</a>
    <a href="index.html#glow">Glow boxes</a>
    <a href="index.html#stitch">Embroidery</a>
    <a href="index.html#studio">The studio</a>
  </nav>
  <div class="switch" role="group" aria-label="Azoki sites">
    <a data-sibling="studios" href="https://azokistudios.com">Studios</a>
    <span class="on" aria-current="page">Market</span>
  </div>
  <button class="cartbtn" data-open-cart>Cart (<span data-cart-count>0</span>)</button>
</header>

<main id="pdp"></main>

<footer class="foot">
  <div class="foot-row" style="margin-top:0">
    <p>&copy; 2026 Azoki Market. Made by Braydon.</p>
    <nav aria-label="Footer">
      <a href="index.html#shop">Shop</a>
      <a data-sibling="studios" href="https://azokistudios.com">Azoki Studios</a>
      <a href="mailto:hello@azokistudios.com">hello@azokistudios.com</a>
    </nav>
  </div>
</footer>

<dialog class="drawer" id="cart" aria-label="Your cart">
  <div class="drawer-in">
    <header><h2>Cart (<span data-cart-count>0</span>)</h2><button data-close aria-label="Close cart">[ close ]</button></header>
    <div class="drawer-body" id="cartBody"></div>
    <footer id="cartFoot">
      <div class="sum"><span>Subtotal</span><b id="cartTotal">$0</b></div>
      <button class="btn red grow" id="checkout">Checkout</button>
      <p class="note" id="cartNote" role="status"></p>
    </footer>
  </div>
</dialog>

<script src="js/products.js"></script>
<script src="js/market.js"></script>
</body>
</html>
